name: Bug report
description: Report a problem with the Krova Cloud MCP server
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** include your Krova Cloud API key or any secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I call `create_cube`, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The tool call(s) and inputs that trigger the bug.
    validations:
      required: true
  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      description: e.g. Claude Desktop, Claude Code, custom client.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "@krovacloud/mcp version"
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.x
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output (redact secrets).
      render: shell
    validations:
      required: false
