name: CI & Release

# Build + test on every pull request and every push to main. On a push to main
# it ALSO cuts a release automatically: it patch-increments the latest version
# published on npm (0.1.3 -> 0.1.4 -> 0.1.5 ...) and publishes it, so every merge
# to main ships a new version WITHOUT anyone editing package.json. (If someone
# does bump package.json to a version higher than npm, that explicit version is
# honored instead.) The published version is recorded as a vX.Y.Z git tag +
# GitHub release; package.json in the repo is intentionally left untouched.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # push the release tag + create the GitHub release
  id-token: write # npm provenance

concurrency:
  group: ci-${{ github.ref }}
  # Serialize main runs (never cancel a release); cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Auto-version and publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT="$(node -e '
            const cp = require("child_process");
            const pkg = require("./package.json");
            let latest = "0.0.0";
            try {
              latest = cp
                .execSync("npm view " + pkg.name + " version", { stdio: ["ignore", "pipe", "ignore"] })
                .toString()
                .trim() || "0.0.0";
            } catch {}
            const cmp = (a, b) => {
              const A = a.split(".").map(Number), B = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) { const d = (A[i] || 0) - (B[i] || 0); if (d) return d; }
              return 0;
            };
            let next;
            if (cmp(pkg.version, latest) > 0) {
              next = pkg.version;                 // honor an explicit manual bump
            } else {
              const p = latest.split(".").map(Number);
              p[2] = (p[2] || 0) + 1;             // otherwise auto-increment the patch
              next = p.join(".");
            }
            console.log(next);
          ')"
          NAME="$(node -p "require('./package.json').name")"
          echo "Releasing ${NAME}@${NEXT}"
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
          git tag "v${NEXT}"
          git push origin "v${NEXT}"
          gh release create "v${NEXT}" --title "${NAME} v${NEXT}" --notes "Automated release on merge to main." || true
