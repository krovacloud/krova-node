name: CI & Release

# Build + test on every pull request and every push to main. On a push to main
# it also releases the packages that CHANGED since their last release — each is
# patch-bumped from its latest npm version and published (with provenance),
# recorded as a <name>@<version> tag + GitHub release. See scripts/release.mjs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # push release tags + create GitHub releases
  id-token: write # npm provenance

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for per-package change detection
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Release changed packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
