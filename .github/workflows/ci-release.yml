name: CI & Release

# Build + test on every pull request and every push to main. On a push to main
# it also releases the packages that CHANGED since their last release — each is
# patch-bumped from its latest npm version and published (with provenance),
# recorded as a <name>@<version> tag + GitHub release. See scripts/release.mjs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # push release tags + create GitHub releases
  id-token: write # npm provenance

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for per-package change detection
      # Trusted publishing needs npm CLI >= 11.5.1 (Node 22 bundles npm 10,
      # which can't mint OIDC credentials — publishes die with ENEEDAUTH).
      # pnpm delegates the final registry call to npm, so npm is what matters.
      - uses: pnpm/action-setup@v6
      # NOTE: no `registry-url:` here — that option writes an .npmrc wired to
      # NODE_AUTH_TOKEN and exports a placeholder value when the secret is
      # absent, which BLOCKS OIDC trusted publishing (the client sends the
      # placeholder instead of minting an OIDC credential). With no token in
      # the environment, pnpm 10.13+ performs the OIDC exchange itself.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Release changed packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # npm auth is OIDC trusted publishing (id-token: write above) — each
        # package's npmjs.com settings trust THIS repo + workflow. No npm
        # token exists to leak or revoke.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
