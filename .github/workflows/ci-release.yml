name: CI & Release

# Build + test on every pull request and every push to main. On a push to main
# it also releases the packages that CHANGED since their last release — each is
# patch-bumped from its latest npm version and published (with provenance),
# recorded as a <name>@<version> tag + GitHub release. See scripts/release.mjs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # push release tags + create GitHub releases
  id-token: write # npm provenance

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for per-package change detection
      # ⛔ No npm anywhere in this job, and that is load-bearing rather than
      # tidy. It used to `npm install -g npm@latest`, because pnpm 10 has NO
      # OIDC support at all (grep its bundle: zero occurrences of "oidc") and
      # shelled the registry call out to npm, which needs >= 11.5.1 to mint an
      # OIDC credential — without it publishes died with ENEEDAUTH.
      #
      # pnpm 11 does the OIDC exchange itself, so npm is no longer in the
      # publish path and the global install is dead weight. If this repo is
      # ever pinned back below pnpm 11, that npm upgrade has to come back or
      # releases break — the pin in package.json#packageManager is what keeps
      # this honest.
      - uses: pnpm/action-setup@v6
      # NOTE: still no `registry-url:` — that option writes an .npmrc wired to
      # NODE_AUTH_TOKEN and exports a placeholder when the secret is absent,
      # which sends the literal placeholder as a bearer token instead of
      # minting an OIDC credential.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # ⛔ Typecheck runs in CI. It did not until now, which is exactly how 26
      # type errors accumulated unnoticed across sdk, cli and mcp in a repo
      # that AUTO-PUBLISHES to npm on every push to main — a fully green PR
      # could ship a package that does not compile.
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Release changed packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # npm auth is OIDC trusted publishing (id-token: write above) — each
        # package's npmjs.com settings trust THIS repo + workflow. No npm
        # token exists to leak or revoke.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs

      # The MCP registry entry used to be published by hand, and drifted twice
      # in a single day — it advertised 0.3.5 while npm served 0.3.6, then 0.3.6
      # while npm served 0.3.7. The failure is SILENT: the registry validates
      # only that the declared version exists on npm carrying the `mcpName`
      # marker, never that it is the latest, so a stale entry never errors. It
      # just tells every MCP client the wrong version, indefinitely.
      #
      # `publish-mcp-registry.mjs` derives the version from npm and exits early
      # when the registry already serves it, so this is safe on every push even
      # though `release.mjs` only republishes packages that changed.
      #
      # ⛔ DNS auth, not `login github-oidc`. OIDC needs no secret, but it only
      # grants the `io.github.<org>/*` namespace — taking it would mean
      # abandoning `cloud.krova/mcp`, republishing under a new name and
      # orphaning the entry that is already live. The branded namespace was a
      # deliberate choice; the secret is what it costs.
      #
      # Skips silently until MCP_PRIVATE_KEY exists, so merging this cannot
      # break a release.
      - name: Publish MCP server to the official registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "MCP_PRIVATE_KEY is not set - skipping the MCP registry publish."
            echo "Add it as a repository secret to enable this step (see packages/mcp/README.md)."
            exit 0
          fi
          # ⛔ Strip everything that is not a hex digit before using the secret.
          # The documented way to derive it ends in `tr -d ' :\n'`, so the output
          # has NO trailing newline — and zsh renders that as a trailing `%`,
          # which gets copied into the secret along with the key. The first real
          # run failed exactly that way:
          #   invalid hex private key format: encoding/hex: invalid byte: U+0025 '%'
          # Stripping is safe because the value is hex by definition, and the
          # length check below turns a genuinely corrupt key into a clear error
          # instead of an opaque one from the publisher.
          KEY="$(printf '%s' "$MCP_PRIVATE_KEY" | tr -cd '0-9a-fA-F')"
          if [ "${#KEY}" -ne 64 ]; then
            echo "MCP_PRIVATE_KEY is not a 32-byte Ed25519 key: got ${#KEY} hex chars, expected 64."
            echo "Re-derive it with:  openssl pkey -in key.pem -noout -text | grep -A3 'priv:' | tail -n +2 | tr -d ' :\n' | pbcopy"
            exit 1
          fi
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain krova.cloud --private-key "$KEY"
          MCP_PUBLISHER_BIN="$PWD/mcp-publisher" node scripts/publish-mcp-registry.mjs
